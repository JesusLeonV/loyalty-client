<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fideliza - Pago Pendiente</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fffbeb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { max-width: 480px; width: 100%; text-align: center; }
    .icon { width: 80px; height: 80px; background: #f59e0b; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
    .icon svg { width: 40px; height: 40px; color: white; }
    h1 { font-size: 24px; color: #92400e; margin-bottom: 8px; }
    p { color: #a16207; font-size: 16px; margin-bottom: 24px; }
    .info { background: white; border-radius: 12px; padding: 20px; margin-bottom: 24px; text-align: left; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    .info p { color: #64748b; font-size: 14px; margin-bottom: 0; }
    .btn { display: block; width: 100%; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s; text-align: center; text-decoration: none; }
    .btn-primary { background: #1e293b; color: white; }
    .btn-primary:hover { background: #334155; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
    </div>
    <h1>Pago pendiente</h1>
    <p>Tu pago está siendo procesado.</p>

    <div class="info">
      <p>Si realizaste una transferencia bancaria o pago en efectivo, tu plan se activará una vez que se confirme el pago. Esto puede tomar hasta 48 horas hábiles.</p>
    </div>

    <a href="/app/" class="btn btn-primary">Volver al panel</a>
  </div>
</body>
</html>
