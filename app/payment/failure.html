<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fideliza - Pago No Completado</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fef2f2; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { max-width: 480px; width: 100%; text-align: center; }
    .icon { width: 80px; height: 80px; background: #ef4444; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
    .icon svg { width: 40px; height: 40px; color: white; }
    h1 { font-size: 24px; color: #991b1b; margin-bottom: 8px; }
    p { color: #b91c1c; font-size: 16px; margin-bottom: 24px; }
    .btn { display: block; width: 100%; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s; text-align: center; text-decoration: none; margin-bottom: 12px; }
    .btn-primary { background: #1e293b; color: white; }
    .btn-primary:hover { background: #334155; }
    .btn-secondary { background: white; color: #1e293b; border: 2px solid #e2e8f0; }
    .btn-secondary:hover { background: #f8fafc; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </div>
    <h1>Pago no completado</h1>
    <p>El pago no pudo ser procesado. Puedes intentar nuevamente.</p>

    <a href="/app/checkout/" class="btn btn-primary">Intentar nuevamente</a>
    <a href="/app/" class="btn btn-secondary">Volver al panel</a>
  </div>
</body>
</html>
